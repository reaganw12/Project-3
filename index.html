<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Responsive Layouts</title>
  <meta name="description" content="This site will serve as the hub for many sub responsive layouts">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon.png">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">
</head>

<body>
  <img src="./img/Record Player Blank.webp" class="Record-Player-Blank">
  
  <div class="TSP-Album-Container">
    <img src="./img/TSP Album.webp" class="TSP-Album">
    <img src="./img/TSP Record.webp" class="TSP-Record">
  </div>

  <script>
    const tsprecord = document.querySelector('.TSP-Record');

    tsprecord.addEventListener('click', function() {
      tsprecord.classList.toggle('is-playing');
    });
  </script>

  <div class="Alice-in-Chains-Album-Container">
    <img src="./img/Alice in Chains.jpg" class="Alice-in-Chains-Album">
    <img src="./img/Alice in Chains Record.webp" class="Alice-in-Chains-Record">
  </div>
 
  <script>
    const aliceinchainsrecord = document.querySelector('.Alice-in-Chains-Record');

    aliceinchainsrecord.addEventListener('click', function() {
      aliceinchainsrecord.classList.toggle('is-playing');
    });
  </script>
  
  <img src="./img/Ovven.jpg" class="Ovven-Album">

  <script src="js/main.js"></script>

</body>

</html>
